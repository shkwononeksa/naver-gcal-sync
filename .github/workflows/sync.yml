name: naver2gcal-sync
on:
  schedule:
    - cron: "17 * * * *"      # 보조: 외부 타이머가 주 트리거(5분), 이건 시간당 1회 안전망
  workflow_dispatch:            # 외부 타이머(POST /dispatches)가 5분마다 호출
    inputs:
      test_notify:
        description: "텔레그램 시험 알림 보내기"
        type: boolean
        default: false
concurrency:
  group: naver2gcal
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: sync
        id: sync
        shell: bash
        env:
          NAVER_CALDAV_PASSWORD: ${{ secrets.NAVER_CALDAV_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CONFIG_TOML: ${{ secrets.CONFIG_TOML }}
        run: |
          # 공개 저장소이므로 설정은 Secret에서 받고, 로그 원문(일정 제목·캘린더 ID 포함)은 출력하지 않는다.
          printf '%s' "$CONFIG_TOML" > config.toml
          set +e
          python naver2gcal.py sync > /tmp/sync.log 2>&1
          rc=$?
          set -e
          echo "종료 코드: $rc"
          echo "요약: $(grep -cE '추가 [0-9]+ · 변경' /tmp/sync.log) 개 캘린더 처리"
          if grep -q "보류했습니다" /tmp/sync.log; then echo "경고: 대량 삭제 보류 발생"; fi
          if grep -qE '401|Unauthorized' /tmp/sync.log; then echo "오류 유형: 네이버 인증(401)"; echo "AUTH401=1" >> "$GITHUB_ENV"; fi
          if grep -q "보류했습니다" /tmp/sync.log; then echo "GUARD=1" >> "$GITHUB_ENV"; fi
          rm -f config.toml
          exit $rc
      # 텔레그램 알림: 일정 내용은 절대 보내지 않는다. 첫 실패, 복구, 6시간마다 재알림, 매일 09시 생존 신호만.
      - name: notify
        if: always() && steps.sync.outcome != 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUTCOME: ${{ steps.sync.outcome }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "텔레그램 설정 없음: 알림 생략"; exit 0; fi
          prev=$(gh run list --repo "${{ github.repository }}" --workflow sync.yml --status completed --limit 1 --json conclusion -q '.[0].conclusion' 2>/dev/null || echo "")
          h=$(date -u +%H); m=$(date -u +%M)
          msg=""
          now=$(TZ=Asia/Seoul date '+%m/%d %H:%M')
          since=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          total=$(gh run list --repo "${{ github.repository }}" --workflow sync.yml --status completed --created ">=$since" --limit 500 --json conclusion -q 'length' 2>/dev/null || echo "?")
          ok=$(gh run list --repo "${{ github.repository }}" --workflow sync.yml --status completed --created ">=$since" --limit 500 --json conclusion -q '[.[]|select(.conclusion=="success")]|length' 2>/dev/null || echo "?")
          if [ "$OUTCOME" = "failure" ]; then
            reason="원인을 아직 몰라요. GitHub 저장소의 Actions 탭에서 가장 최근 실행 기록을 확인해 주세요."
            [ "${AUTH401:-}" = "1" ] && reason="네이버 로그인 오류예요. 네이버 앱 비밀번호를 새로 만들어 GitHub 비밀값(NAVER_CALDAV_PASSWORD)에 다시 넣어 주세요."
            if [ "$prev" != "failure" ]; then msg="⚠️ 캘린더 동기화가 멈췄어요 ($now)
$reason"
            elif [ $((10#$h % 6)) -eq 0 ] && [ $((10#$m)) -lt 5 ]; then msg="⚠️ 캘린더 동기화가 아직 멈춰 있어요 ($now)
$reason"; fi
          elif [ "$OUTCOME" = "success" ]; then
            if [ "$prev" = "failure" ]; then msg="✅ 캘린더 동기화가 다시 정상이에요 ($now)
멈춰 있던 동안 바뀐 일정도 함께 반영됐어요."
            elif [ "${GUARD:-}" = "1" ]; then msg="🛑 일정이 한꺼번에 많이 지워질 뻔해서 막았어요 ($now)
네이버에서 일정을 정리하신 거라면 그대로 두셔도 되고, 아니라면 확인해 주세요."
            elif [ "$h" = "00" ] && [ $((10#$m)) -lt 5 ]; then msg="🟢 오늘도 정상이에요 ($now)
지난 24시간 동안 ${total}번 중 ${ok}번 동기화에 성공했어요."; fi
          fi
          [ "${{ github.event.inputs.test_notify }}" = "true" ] && msg="🔔 시험 알림이에요 ($now)
이 메시지가 보이면 알림이 정상으로 연결된 거예요."
          if [ -n "$msg" ]; then
            curl -s -o /dev/null -w "텔레그램 응답: %{http_code}\n" "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=$(printf '%b' "$msg")"
          else
            echo "보낼 알림 없음"
          fi
      # 멈춤 감시: 동기화가 성공할 때마다 GitHub 바깥의 감시 서비스(healthchecks.io)에 신호를 보낸다.
      # 신호가 일정 시간 끊기면 그쪽에서 알림을 보낸다(타이머·GitHub가 멈춘 경우 포함). 설정(HC_PING_URL)이 없으면 건너뛴다.
      - name: heartbeat
        if: steps.sync.outcome == 'success'
        shell: bash
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: |
          if [ -z "$HC_PING_URL" ]; then echo "HC_PING_URL 없음: 신호 생략"; exit 0; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC_PING_URL" && echo "감시 신호 전송" || echo "감시 신호 실패(무시)"
      # 공개 저장소는 60일 무활동 시 예약이 꺼진다. 실행마다 스스로 다시 켠다.
      - name: keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable "naver2gcal-sync" --repo "${{ github.repository }}" || true
