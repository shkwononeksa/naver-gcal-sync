name: naver2gcal-sync
on:
  schedule:
    - cron: "17 * * * *"      # 보조: 외부 타이머가 주 트리거(5분), 이건 시간당 1회 안전망
  workflow_dispatch: {}         # 외부 타이머(POST /dispatches)가 5분마다 호출
concurrency:
  group: naver2gcal
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: sync
        id: sync
        shell: bash
        env:
          NAVER_CALDAV_PASSWORD: ${{ secrets.NAVER_CALDAV_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CONFIG_TOML: ${{ secrets.CONFIG_TOML }}
        run: |
          # 공개 저장소이므로 설정은 Secret에서 받고, 로그 원문(일정 제목·캘린더 ID 포함)은 출력하지 않는다.
          printf '%s' "$CONFIG_TOML" > config.toml
          set +e
          python naver2gcal.py sync > /tmp/sync.log 2>&1
          rc=$?
          set -e
          echo "종료 코드: $rc"
          echo "요약: $(grep -cE '추가 [0-9]+ · 변경' /tmp/sync.log) 개 캘린더 처리"
          if grep -q "보류했습니다" /tmp/sync.log; then echo "경고: 대량 삭제 보류 발생"; fi
          if grep -qE '401|Unauthorized' /tmp/sync.log; then echo "오류 유형: 네이버 인증(401)"; echo "AUTH401=1" >> "$GITHUB_ENV"; fi
          if grep -q "보류했습니다" /tmp/sync.log; then echo "GUARD=1" >> "$GITHUB_ENV"; fi
          rm -f config.toml
          exit $rc
      # 텔레그램 알림: 일정 내용은 절대 보내지 않는다. 첫 실패, 복구, 6시간마다 재알림, 매일 09시 생존 신호만.
      - name: notify
        if: always() && steps.sync.outcome != 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUTCOME: ${{ steps.sync.outcome }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "텔레그램 설정 없음: 알림 생략"; exit 0; fi
          prev=$(gh run list --repo "${{ github.repository }}" --workflow sync.yml --status completed --limit 1 --json conclusion -q '.[0].conclusion' 2>/dev/null || echo "")
          h=$(date -u +%H); m=$(date -u +%M)
          msg=""
          if [ "$OUTCOME" = "failure" ]; then
            reason="원인 확인 필요"
            [ "${AUTH401:-}" = "1" ] && reason="네이버 인증 오류(401): 앱 비밀번호 재발급 필요"
            if [ "$prev" != "failure" ]; then msg="[캘린더 동기화] 실패: $reason"
            elif [ $((10#$h % 6)) -eq 0 ] && [ $((10#$m)) -lt 5 ]; then msg="[캘린더 동기화] 계속 실패 중: $reason"; fi
          elif [ "$OUTCOME" = "success" ]; then
            if [ "$prev" = "failure" ]; then msg="[캘린더 동기화] 복구되었습니다."
            elif [ "${GUARD:-}" = "1" ]; then msg="[캘린더 동기화] 대량 삭제 보호가 작동해 삭제를 보류했습니다."
            elif [ "$h" = "00" ] && [ $((10#$m)) -lt 5 ]; then msg="[캘린더 동기화] 정상 작동 중"; fi
          fi
          if [ -n "$msg" ]; then
            curl -s -o /dev/null -w "텔레그램 응답: %{http_code}\n" "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${msg}"
          else
            echo "보낼 알림 없음"
          fi
      # 공개 저장소는 60일 무활동 시 예약이 꺼진다. 실행마다 스스로 다시 켠다.
      - name: keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable "naver2gcal-sync" --repo "${{ github.repository }}" || true
